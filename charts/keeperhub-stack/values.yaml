# Default values for keeperhub-stack.
#
# Every top-level key below maps to one aliased instance of the `common` chart
# (see Chart.yaml dependencies). The keys under each alias are passed straight
# through to that `common` subchart, so anything `common` supports (deployment,
# service, env, externalSecrets, autoscaling, resources, nodeSelector, ...) is
# set here under the matching component.
#
# Images, env vars and secrets are intentionally placeholders. The real
# per-environment values (ECR image tags, SSM-backed secrets, replica counts)
# are supplied at deploy time with `-f <env>/values.yaml` from the keeperhub
# repo, the same way the standalone releases work today.
#
# Deploy the whole stack atomically:
#   helm dependency build charts/keeperhub-stack
#   helm upgrade --install keeperhub charts/keeperhub-stack \
#     -f keeperhub/deploy/keeperhub/<env>/values.yaml \
#     --atomic --wait --timeout 15m
# On any component failing its readiness check within the timeout, the entire
# release (all components) is rolled back to the previous revision.
#
# Note: `common`'s bundled service.yaml, certificate.yaml and test-connection
# templates dereference .Values.service(.tls.enabled/.port), so every component
# carries a full `service` block even when it runs no HTTP server.

# ---------------------------------------------------------------------------
# app - the Next.js application (runs DB migrations via its db-migration
# initContainer). Successor to the standalone `keeperhub-common` release.
# ---------------------------------------------------------------------------
app:
  enabled: true
  replicaCount: 2
  image:
    repository: keeperhub-app
    tag: latest
    pullPolicy: Always
  deployment:
    enabled: true
  service:
    enabled: true
    type: ClusterIP
    port: 3000
    containerPort: 3000
    tls:
      enabled: false
  env: {}

# ---------------------------------------------------------------------------
# executor - SQS consumer that POSTs /api/workflow/:id/execute.
# Successor to `keeperhub-executor-common`.
# ---------------------------------------------------------------------------
executor:
  enabled: true
  replicaCount: 1
  image:
    repository: keeperhub-executor
    tag: latest
    pullPolicy: Always
  deployment:
    enabled: true
  service:
    enabled: true
    type: ClusterIP
    port: 3080
    containerPort: 3080
    tls:
      enabled: false
  env: {}

# ---------------------------------------------------------------------------
# schedule - cron schedule dispatcher. Successor to `keeperhub-schedule-common`.
# Runs no HTTP server; the service block exists only to satisfy common's
# bundled service/certificate/test templates.
# ---------------------------------------------------------------------------
schedule:
  enabled: true
  replicaCount: 1
  image:
    repository: keeperhub-scheduler
    tag: latest
    pullPolicy: Always
  deployment:
    enabled: true
  service:
    enabled: false
    type: ClusterIP
    port: 80
    tls:
      enabled: false
  env: {}

# ---------------------------------------------------------------------------
# block - block dispatcher (WSS to EVM nodes). Successor to
# `keeperhub-block-common`.
# ---------------------------------------------------------------------------
block:
  enabled: true
  replicaCount: 1
  image:
    repository: keeperhub-scheduler
    tag: latest
    pullPolicy: Always
  deployment:
    enabled: true
  service:
    enabled: false
    type: ClusterIP
    port: 80
    tls:
      enabled: false
  env: {}

# ---------------------------------------------------------------------------
# metricsCollector - periodic metrics collector. Successor to
# `keeperhub-metrics-collector-common`.
# ---------------------------------------------------------------------------
metricsCollector:
  enabled: true
  # Alias is camelCase for clean values access; override the rendered name so
  # the k8s resources are RFC1123-valid (lowercase) -> keeperhub-metrics-collector.
  nameOverride: metrics-collector
  replicaCount: 1
  image:
    repository: keeperhub-metrics-collector
    tag: latest
    pullPolicy: Always
  deployment:
    enabled: true
  service:
    enabled: false
    type: ClusterIP
    port: 80
    tls:
      enabled: false
  env: {}

# ---------------------------------------------------------------------------
# Optional bundled data plane.
#
# Both default to false, so this changes nothing for an environment that brings
# its own database and queue - which includes staging and prod.
#
# These are chart TEMPLATES, not dependencies, on purpose. This repo's CI has no
# `helm dependency build` step, and helm fails chart load on a dependencies
# entry whose archive is missing EVEN WHEN its condition is false: it matches on
# dependency name and never reads the condition. A dependency would therefore
# mean a second hand-maintained .tgz committed to git for something that is off
# by default. See charts/keeperhub-stack/README.md.
# ---------------------------------------------------------------------------

postgresql:
  # Requires the CloudNativePG OPERATOR to be installed cluster-wide first. Its
  # CRDs are cluster-scoped, so they cannot come from a subchart inside this
  # release. When true, this chart renders only the Cluster object.
  bundled: false
  # Object name. CNPG then creates <name>-rw / -ro / -r Services.
  # Defaults to <release>-postgres.
  nameOverride: ""
  # 1 for a single instance, 3 for HA with automatic failover. HA needs at least
  # that many schedulable nodes or the extra instances never become ready.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  database: keeperhub
  owner: keeperhub
  # Name of a kubernetes.io/basic-auth Secret holding username and password.
  # Supply one rather than letting CNPG generate: the installer has to compose
  # the same credentials into a connection string, and a supplied password
  # survives a helm rollback. Prefer hex over base64 - a "/" in a password
  # breaks URL parsing in the migration step.
  credentialsSecret: ""
  storage:
    size: 20Gi
    storageClass: ""      # "" means the cluster default
  walStorage:
    enabled: false
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  parameters:
    max_connections: "200"
    shared_buffers: 256MB
  monitoring: {}
  # Passed through to Cluster.spec.backup verbatim. Backup and restore are
  # CloudNativePG's; this chart does not reimplement them.
  backup: {}
  # Passed through to Cluster.spec.bootstrap.recovery. When set, the cluster is
  # restored instead of initialised.
  recovery: {}
  # Passed through to Cluster.spec.externalClusters, which is what a recovery
  # from an object store reads from. Needed for any restore into a different
  # namespace or cluster: the alternative, naming a Backup object, is namespaced.
  externalClusters: []
  # Parameters the owner may SET without being a superuser, granted once at
  # bootstrap. pg_parameter_acl is a shared catalog, so one grant covers every
  # database in the cluster.
  #
  # The usual entry is session_replication_role, which a test harness sets to
  # 'replica' to suppress triggers while deleting rows. Granting it is not the
  # privilege escalation it looks like: the owner already owns every table and
  # can ALTER TABLE ... DISABLE TRIGGER, so this adds no capability it lacks.
  #
  # Bootstrap-only, like everything under initdb. CloudNativePG runs these once,
  # when the cluster is created; adding an entry later does nothing to a running
  # cluster and the GRANT has to be issued by hand.
  grantSetOnParameters: []
  primaryUpdateStrategy: unsupervised
  affinity: {}
  annotations: {}
  extraInitSQL: []
  # Survive an --atomic rollback of a failed install rather than being deleted
  # along with the release, taking the data with it.
  keepOnDelete: true

queue:
  bundled: false
  # Defaults to the bare name, NOT <release>-queue. The Service name is part of
  # the queue URL, which is an HMAC signing input, so renaming it on an existing
  # install rejects every in-flight message. Change only on a clean install.
  name: elasticmq
  image:
    repository: softwaremill/elasticmq-native
    tag: "1.6.16"
    pullPolicy: IfNotPresent
  port: 9324
  statsPort: 9325
  region: us-east-1
  accountId: "000000000000"
  queues:
    - name: keeperhub-workflow-queue
      defaultVisibilityTimeout: 300 seconds
    - name: keeperhub-workflow-queue-dlq
      defaultVisibilityTimeout: 300 seconds
  persistence:
    # Without this a restart drops every in-flight message. Verified on
    # elasticmq-native:1.6.16 that the native image persists messages and that
    # DeleteMessage is persisted too, so processed work is not redelivered.
    enabled: true
    size: 2Gi
    storageClass: ""      # "" means the cluster default
    h2Uri: jdbc:h2:/data/elasticmq
    keepOnDelete: true
  # Measured sufficient for H2 to release its lock cleanly across restarts.
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------
# Install secrets.
#
# Off by default, so staging and prod are unaffected - they get these from SSM
# through External Secrets and must keep doing so. This exists for an install
# that has no secret manager, where the alternative is a human generating eight
# values by hand and getting the encoding of two of them wrong.
#
# Each key resolves in this order:
#   1. an explicit value in secrets.values below
#   2. the value already in the cluster, so an upgrade never rotates a key
#   3. a generated one
#
# Step 2 is why these Secrets carry helm.sh/resource-policy: keep. Losing
# INTEGRATION_ENCRYPTION_KEY orphans every stored integration credential, and an
# --atomic rollback of a failed first install would otherwise delete it.
#
# KNOWN LIMIT: step 2 uses `lookup`, which returns nothing under `helm template`
# and `--dry-run`. Rendering shows fresh values every time, and a
# `helm template | kubectl apply` pipeline ROTATES these keys on every run. If
# you deploy that way, either pin every key in secrets.values or set
# generate: false and create the Secrets yourself.
# ---------------------------------------------------------------------------

secrets:
  generate: false

  # Explicit values win over both the stored and the generated value. Anything
  # left empty falls through. Supply these with --set or a private values file,
  # never in a committed one.
  values: {}
  #   INTERNAL_SERVICE_HMAC_SECRET: ""   # base64 of exactly 32 bytes
  #   AGENTIC_WALLET_HMAC_KMS_KEY: ""    # base64 of exactly 32 bytes
  #   BETTER_AUTH_SECRET: ""
  #   OAUTH_JWT_SECRET: ""
  #   MCP_SESSION_SECRET: ""
  #   INTEGRATION_ENCRYPTION_KEY: ""     # 64 hex characters
  #   DATABASE_URL: ""                   # only needed when postgresql.bundled is false
  #   POSTGRES_PASSWORD: ""              # only used when postgresql.bundled is true
  #   SENDGRID_API_KEY: ""               # never generated; empty means email is off
  #   TURNKEY_API_PUBLIC_KEY: ""         # never generated
  #   TURNKEY_API_PRIVATE_KEY: ""        # never generated
  #   TURNKEY_ORGANIZATION_ID: ""        # never generated

  # Secret names. They are referenced by env entries in the component values and
  # by the executor, which builds runner Job references as
  # "<runnerSecretPrefix>-<slug>" with the key equal to the name.
  sharedName: keeperhub-shared
  emailName: keeperhub-email
  runnerSecretPrefix: keeperhub-executor

  # Where the connection string lives. In bundled mode this chart composes and
  # writes it. In bring-your-own mode you create this Secret, and the chart reads
  # it only to copy the value into the runner's Secret.
  dbSecretName: keeperhub-db
  dbSecretKey: DATABASE_URL

# The ServiceAccount runner Job pods run as. Deliberately carries no RBAC and no
# annotations: Jobs are created by the executor through the Kubernetes API, and
# the runner itself needs to reach nothing in the cluster.
runnerServiceAccount:
  create: false
  name: keeperhub-workflow-runner

# Fail the render when a pinned endpoint literal disagrees with what the bundled
# component renders. Neither mismatch surfaces as a connection error, so both
# are checked at render time instead. Set false for topologies this does not
# anticipate.
strictEndpointCheck: true
