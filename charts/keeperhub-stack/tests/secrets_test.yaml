suite: install secrets and the runner ServiceAccount
templates:
  - templates/secrets.yaml
  - templates/runner-sa.yaml
  - templates/postgres-cnpg.yaml
# Documents are selected by name rather than by index throughout. An index would
# pass silently against the wrong Secret the moment one is added or reordered.
tests:
  # The whole point of the default. Staging and production get these from SSM
  # through External Secrets, and a chart that also rendered them would fight
  # that.
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  # Generating secrets must not drag the ServiceAccount in with it. Staging and
  # production create that object from their own manifest, alongside the RBAC and
  # NetworkPolicy that belong with it.
  - it: renders no ServiceAccount unless asked
    template: templates/runner-sa.yaml
    set:
      secrets:
        generate: true
        values:
          DATABASE_URL: "postgresql://u:p@db.example.svc.cluster.local:5432/kh"
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the runner ServiceAccount with no token and no annotations
    template: templates/runner-sa.yaml
    set:
      runnerServiceAccount:
        create: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: keeperhub-workflow-runner
      - equal:
          path: automountServiceAccountToken
          value: false
      - notExists:
          path: metadata.annotations

  - it: renders one Secret per purpose in bundled mode
    template: templates/secrets.yaml
    set:
      secrets:
        generate: true
      postgresql:
        bundled: true
    release:
      name: kh
    asserts:
      - hasDocuments:
          count: 6

  - it: generates the shared secrets in the formats the application requires
    template: templates/secrets.yaml
    set:
      secrets:
        generate: true
      postgresql:
        bundled: true
    asserts:
      # base64 of exactly 32 bytes is 43 characters plus one pad
      - matchRegex:
          path: stringData.INTERNAL_SERVICE_HMAC_SECRET
          pattern: "^[A-Za-z0-9+/]{43}=$"
        documentSelector:
          path: metadata.name
          value: keeperhub-shared
      - matchRegex:
          path: stringData.AGENTIC_WALLET_HMAC_KMS_KEY
          pattern: "^[A-Za-z0-9+/]{43}=$"
        documentSelector:
          path: metadata.name
          value: keeperhub-shared
      - matchRegex:
          path: stringData.BETTER_AUTH_SECRET
          pattern: "^[0-9a-f]{64}$"
        documentSelector:
          path: metadata.name
          value: keeperhub-shared
      # aes-256-gcm material for the runner
      - matchRegex:
          path: stringData.keeperhub-executor-integration-encryption-key
          pattern: "^[0-9a-f]{64}$"
        documentSelector:
          path: metadata.name
          value: keeperhub-executor-integration-encryption-key

  # Never generated. An invented API key turns a clean unconfigured state into
  # 401s, and an invented Turnkey key fails once an org has an active wallet.
  - it: leaves email and turnkey keys empty rather than inventing them
    template: templates/secrets.yaml
    set:
      secrets:
        generate: true
      postgresql:
        bundled: true
    asserts:
      - equal:
          path: stringData.TURNKEY_API_PUBLIC_KEY
          value: ""
        documentSelector:
          path: metadata.name
          value: keeperhub-shared
      - equal:
          path: stringData.TURNKEY_API_PRIVATE_KEY
          value: ""
        documentSelector:
          path: metadata.name
          value: keeperhub-shared
      - equal:
          path: stringData.SENDGRID_API_KEY
          value: ""
        documentSelector:
          path: metadata.name
          value: keeperhub-email

  - it: prefers an explicit value over a generated one
    template: templates/secrets.yaml
    set:
      secrets:
        generate: true
        values:
          INTERNAL_SERVICE_HMAC_SECRET: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAE="
          SENDGRID_API_KEY: "SG.explicit"
      postgresql:
        bundled: true
    asserts:
      - equal:
          path: stringData.INTERNAL_SERVICE_HMAC_SECRET
          value: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAE="
        documentSelector:
          path: metadata.name
          value: keeperhub-shared
      - equal:
          path: stringData.SENDGRID_API_KEY
          value: "SG.explicit"
        documentSelector:
          path: metadata.name
          value: keeperhub-email

  # Losing the encryption key orphans every stored integration credential, and
  # KEEP-1151 proved an --atomic rollback of a failed first install deletes what
  # the release created. Every generated Secret carries the annotation for that
  # reason.
  - it: keeps every generated secret through a release rollback
    template: templates/secrets.yaml
    set:
      secrets:
        generate: true
      postgresql:
        bundled: true
    release:
      name: kh
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentSelector:
          path: metadata.name
          value: kh-db-credentials
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentSelector:
          path: metadata.name
          value: keeperhub-shared
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentSelector:
          path: metadata.name
          value: keeperhub-executor-integration-encryption-key
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentSelector:
          path: metadata.name
          value: keeperhub-db

  # CloudNativePG's own uri and fqdn-uri keys use hosts that do not end
  # .svc.cluster.local, which makes the application force sslmode=verify-full
  # and fail TLS against the in-cluster certificate.
  - it: composes a connection string on the fully qualified in-cluster host
    template: templates/secrets.yaml
    set:
      secrets:
        generate: true
      postgresql:
        bundled: true
        database: keeperhub
        owner: keeperhub
    release:
      name: kh
      namespace: keeperhub
    asserts:
      - matchRegex:
          path: stringData.DATABASE_URL
          pattern: "^postgresql://keeperhub:[0-9a-f]{64}@kh-postgres-rw\\.keeperhub\\.svc\\.cluster\\.local:5432/keeperhub$"
        documentSelector:
          path: metadata.name
          value: keeperhub-db
      # The runner gets the same string, from the Secret the executor names.
      - matchRegex:
          path: stringData.keeperhub-executor-db-url
          pattern: "^postgresql://keeperhub:[0-9a-f]{64}@kh-postgres-rw\\.keeperhub\\.svc\\.cluster\\.local:5432/keeperhub$"
        documentSelector:
          path: metadata.name
          value: keeperhub-executor-db-url

  # The password ends up inside a URL. A "/" from base64 breaks parsing in the
  # migration step, so it is hex.
  - it: uses a hex database password
    template: templates/secrets.yaml
    set:
      secrets:
        generate: true
      postgresql:
        bundled: true
    release:
      name: kh
    asserts:
      - matchRegex:
          path: stringData.password
          pattern: "^[0-9a-f]{64}$"
        documentSelector:
          path: metadata.name
          value: kh-db-credentials
      - equal:
          path: type
          value: kubernetes.io/basic-auth
        documentSelector:
          path: metadata.name
          value: kh-db-credentials

  # Without the URL every runner Job pod fails CreateContainerConfigError,
  # because the executor references DATABASE_URL non-optionally. Failing the
  # render says so; failing at runtime names the container instead.
  - it: fails closed when bring-your-own is on and no connection string resolves
    template: templates/secrets.yaml
    set:
      secrets:
        generate: true
      postgresql:
        bundled: false
    asserts:
      - failedTemplate:
          errorPattern: "the connection string could not be resolved"

  - it: accepts an operator-supplied connection string in bring-your-own mode
    template: templates/secrets.yaml
    set:
      secrets:
        generate: true
        values:
          DATABASE_URL: "postgresql://u:p@db.example.svc.cluster.local:5432/kh"
      postgresql:
        bundled: false
    asserts:
      # No CNPG credentials Secret and no chart-owned keeperhub-db here: the
      # operator owns both.
      - hasDocuments:
          count: 4
      - equal:
          path: stringData.keeperhub-executor-db-url
          value: "postgresql://u:p@db.example.svc.cluster.local:5432/kh"
        documentSelector:
          path: metadata.name
          value: keeperhub-executor-db-url

  # The Cluster must bootstrap from the same Secret this chart writes. If the two
  # names disagreed the operator would generate its own credentials, and the
  # connection string composed above would authenticate against nothing - with
  # both objects looking correct in isolation.
  - it: points CloudNativePG at the credentials Secret the chart creates
    set:
      secrets:
        generate: true
      postgresql:
        bundled: true
    release:
      name: kh
    asserts:
      - equal:
          path: spec.bootstrap.initdb.secret.name
          value: kh-db-credentials
        template: templates/postgres-cnpg.yaml
      - equal:
          path: metadata.name
          value: kh-db-credentials
        template: templates/secrets.yaml
        documentSelector:
          path: type
          value: kubernetes.io/basic-auth

  - it: still honours an explicitly named credentials Secret
    set:
      secrets:
        generate: true
      postgresql:
        bundled: true
        credentialsSecret: my-own-creds
    release:
      name: kh
    asserts:
      - equal:
          path: spec.bootstrap.initdb.secret.name
          value: my-own-creds
        template: templates/postgres-cnpg.yaml
      - equal:
          path: metadata.name
          value: my-own-creds
        template: templates/secrets.yaml
        documentSelector:
          path: type
          value: kubernetes.io/basic-auth
