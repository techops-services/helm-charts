{{/*
Install secrets, so a cluster with no secret manager can install this chart
without a human generating eight values by hand.

Two of those values have formats that are not interchangeable and fail in ways
that do not look like a format problem:
  - INTERNAL_SERVICE_HMAC_SECRET and AGENTIC_WALLET_HMAC_KMS_KEY must base64
    decode to exactly 32 bytes
  - INTEGRATION_ENCRYPTION_KEY must be 64 hex characters, aes-256-gcm material
The generators below produce exactly those, which is the main reason this is
worth doing in the chart rather than in a README instruction.
*/}}
{{- if .Values.secrets.generate }}

{{- $ns := .Release.Namespace }}
{{- $given := .Values.secrets.values | default dict }}
{{- $prefix := .Values.secrets.runnerSecretPrefix }}
{{- $encName := printf "%s-integration-encryption-key" $prefix }}
{{- $dbUrlName := printf "%s-db-url" $prefix }}

{{/*
The components reference the connection-string Secret by name from their own env
entries, and this template writes it. If those two disagreed the pods would fail
CreateContainerConfigError against a Secret that exists under another name.

A values file cannot compute a subchart's env value from a sibling chart value,
so the shared answer has to live somewhere both can read. `global` is that place:
helm merges it into every subchart. When it is set it wins, so a profile declares
the name once and both sides follow.
*/}}
{{- $global := .Values.global | default dict }}
{{- $globalDb := $global.db | default dict }}
{{- $dbSecretName := $globalDb.secretName | default .Values.secrets.dbSecretName }}
{{- $dbSecretKey := $globalDb.secretKey | default .Values.secrets.dbSecretKey }}

{{/* The database password, resolved once and reused by both Secrets below. */}}
{{- $pgPassword := "" }}
{{- if .Values.postgresql.bundled }}
{{- $pgSecretName := include "keeperhub-stack.pgCredentialsSecret" . }}
{{/*
Resolved inline rather than through keeperhub-stack.secretValue, because this is
a kubernetes.io/basic-auth Secret that CNPG reads at bootstrap: the stored value
lives under `password`, not under the name used in secrets.values.

Hex, not base64. A "/" in the password breaks URL parsing in the migration step,
and 64 hex characters carry more entropy than the base64 form anyway.
*/}}
{{- $pgPassword = index $given "POSTGRES_PASSWORD" | default "" }}
{{- if not $pgPassword }}
{{- $existingPg := lookup "v1" "Secret" $ns $pgSecretName }}
{{- if $existingPg }}
{{- $stored := index ($existingPg.data | default dict) "password" | default "" }}
{{- if $stored }}
{{- $pgPassword = b64dec $stored }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $pgPassword }}
{{- $pgPassword = sha256sum (randAlphaNum 64) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "keeperhub-stack.pgLabels" . | nindent 4 }}
  annotations:
    # Without this, an --atomic rollback of a failed first install removes the
    # credentials CloudNativePG bootstrapped the database with, leaving a PVC
    # nothing can authenticate against.
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresql.owner | quote }}
  password: {{ $pgPassword | quote }}
{{- end }}

{{/*
The connection string every component reads.

Composed by hand in bundled mode rather than taken from CloudNativePG's own
`uri` / `fqdn-uri` keys: those use hosts that do not end .svc.cluster.local, so
the application forces sslmode=verify-full and fails TLS against the in-cluster
certificate.
*/}}
{{- $dbUrl := index $given "DATABASE_URL" | default "" }}
{{- if .Values.postgresql.bundled }}
{{- $dbUrl = printf "postgresql://%s:%s@%s:5432/%s" .Values.postgresql.owner $pgPassword (include "keeperhub-stack.pgHost" .) .Values.postgresql.database }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "keeperhub-stack.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $dbSecretKey }}: {{ $dbUrl | quote }}
{{- else }}
{{/*
Bring-your-own: the operator created the Secret, so read the URL back out of it
to hand to runner Job pods. Those pods get DATABASE_URL by secretKeyRef from a
Secret the executor names itself, which cannot be the operator's.
*/}}
{{- if not $dbUrl }}
{{- $byo := lookup "v1" "Secret" $ns $dbSecretName }}
{{- if $byo }}
{{- $stored := index ($byo.data | default dict) $dbSecretKey | default "" }}
{{- if $stored }}
{{- $dbUrl = b64dec $stored }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $dbUrl }}
{{- $existingRunner := lookup "v1" "Secret" $ns $dbUrlName }}
{{- if $existingRunner }}
{{- $stored := index ($existingRunner.data | default dict) $dbUrlName | default "" }}
{{- if $stored }}
{{- $dbUrl = b64dec $stored }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $dbUrl }}
{{- fail (printf "\n\nsecrets.generate is on with postgresql.bundled off, but the connection string could not be resolved.\n\nThe chart looked for Secret %q key %q in namespace %q and found nothing.\n\nCreate that Secret before installing, or pass the URL as secrets.values.DATABASE_URL.\nWithout it every runner Job pod fails CreateContainerConfigError, because the\nexecutor references DATABASE_URL non-optionally.\n" $dbSecretName $dbSecretKey $ns) }}
{{- end }}
{{- end }}

{{/*
Shared application secrets.

The three TURNKEY_ keys are never generated. They must exist because the app and
the executor reference them, but empty is correct until an organisation has an
active wallet - inventing a value would turn a clean unconfigured state into a
runtime failure.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.sharedName }}
  namespace: {{ $ns }}
  labels:
    {{- include "keeperhub-stack.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  INTERNAL_SERVICE_HMAC_SECRET: {{ include "keeperhub-stack.secretValue" (dict "given" $given "key" "INTERNAL_SERVICE_HMAC_SECRET" "ns" $ns "secretName" .Values.secrets.sharedName "format" "b64") | quote }}
  AGENTIC_WALLET_HMAC_KMS_KEY: {{ include "keeperhub-stack.secretValue" (dict "given" $given "key" "AGENTIC_WALLET_HMAC_KMS_KEY" "ns" $ns "secretName" .Values.secrets.sharedName "format" "b64") | quote }}
  BETTER_AUTH_SECRET: {{ include "keeperhub-stack.secretValue" (dict "given" $given "key" "BETTER_AUTH_SECRET" "ns" $ns "secretName" .Values.secrets.sharedName "format" "hex") | quote }}
  OAUTH_JWT_SECRET: {{ include "keeperhub-stack.secretValue" (dict "given" $given "key" "OAUTH_JWT_SECRET" "ns" $ns "secretName" .Values.secrets.sharedName "format" "hex") | quote }}
  MCP_SESSION_SECRET: {{ include "keeperhub-stack.secretValue" (dict "given" $given "key" "MCP_SESSION_SECRET" "ns" $ns "secretName" .Values.secrets.sharedName "format" "hex") | quote }}
  TURNKEY_API_PUBLIC_KEY: {{ include "keeperhub-stack.secretValue" (dict "given" $given "key" "TURNKEY_API_PUBLIC_KEY" "ns" $ns "secretName" .Values.secrets.sharedName "format" "none") | quote }}
  TURNKEY_API_PRIVATE_KEY: {{ include "keeperhub-stack.secretValue" (dict "given" $given "key" "TURNKEY_API_PRIVATE_KEY" "ns" $ns "secretName" .Values.secrets.sharedName "format" "none") | quote }}
  TURNKEY_ORGANIZATION_ID: {{ include "keeperhub-stack.secretValue" (dict "given" $given "key" "TURNKEY_ORGANIZATION_ID" "ns" $ns "secretName" .Values.secrets.sharedName "format" "none") | quote }}

{{/*
Runner Job secrets. The executor builds these references itself as
"<prefix>-<slug>", with the key equal to the name, so the name and the key must
match exactly. DATABASE_URL and INTEGRATION_ENCRYPTION_KEY are the only two the
executor marks non-optional, so a missing one is not a degraded runner - it is
CreateContainerConfigError on every Job pod.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbUrlName }}
  namespace: {{ $ns }}
  labels:
    {{- include "keeperhub-stack.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $dbUrlName }}: {{ $dbUrl | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $encName }}
  namespace: {{ $ns }}
  labels:
    {{- include "keeperhub-stack.commonLabels" . | nindent 4 }}
  annotations:
    # The one annotation here that is load-bearing rather than cautious. This key
    # encrypts every stored integration credential; regenerating it orphans them
    # all with no way back.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $encName }}: {{ include "keeperhub-stack.secretValue" (dict "given" $given "key" "INTEGRATION_ENCRYPTION_KEY" "storedKey" $encName "ns" $ns "secretName" $encName "format" "hex") | quote }}

{{/*
Outbound email. Rendered even when empty, because the components reference it
with a plain secretKeyRef and `common` offers no way to mark that optional - a
missing Secret is CreateContainerConfigError, not a degraded install. Never
generated: a random string here replaces a clean unconfigured state with 401s.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.emailName }}
  namespace: {{ $ns }}
  labels:
    {{- include "keeperhub-stack.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SENDGRID_API_KEY: {{ include "keeperhub-stack.secretValue" (dict "given" $given "key" "SENDGRID_API_KEY" "ns" $ns "secretName" .Values.secrets.emailName "format" "none") | quote }}

{{- end }}
