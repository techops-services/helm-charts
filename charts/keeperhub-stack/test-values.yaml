# Test values for keeperhub-stack (CI: helm template + dry-run install).
#
# Uses a public image for every component so the dry-run renders without
# pulling private ECR images or touching external dependencies. Mirrors the
# real shape (one aliased `common` instance per component) so template parity
# is exercised.
app:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  deployment:
    enabled: true
  service:
    enabled: true
    port: 3000
    containerPort: 3000

executor:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  deployment:
    enabled: true

schedule:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  deployment:
    enabled: true

block:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  deployment:
    enabled: true

metricsCollector:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  deployment:
    enabled: true

# The queue is ON here and the database is OFF, and the asymmetry is forced by
# what the release workflow does rather than by preference.
#
# That workflow runs `helm upgrade --install --dry-run` against a throwaway
# minikube. A dry-run still builds the resource list, and building it needs a
# REST mapping for every kind, which means the CRD must be registered on that
# cluster. CI installs no operators, so a rendered CloudNativePG Cluster fails
# with `no matches for kind "Cluster" in version "postgresql.cnpg.io/v1"` before
# anything is validated. Turning the database on here does not test the bundled
# path, it only breaks the job.
#
# Nothing is lost. tests/data_plane_test.yaml renders postgres-cnpg.yaml under
# helm-unittest, which needs no cluster and asserts the CR's contents directly,
# which is stronger than a dry-run would have been anyway.
#
# The queue stays ON because it is ConfigMap, Service and StatefulSet - all core
# kinds - so it exercises the enabled path end to end in the dry-run.
postgresql:
  bundled: false
queue:
  bundled: true
