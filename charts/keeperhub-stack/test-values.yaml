# Test values for keeperhub-stack (CI: helm template + dry-run install).
#
# Uses a public image for every component so the dry-run renders without
# pulling private ECR images or touching external dependencies. Mirrors the
# real shape (one aliased `common` instance per component) so template parity
# is exercised.
app:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  deployment:
    enabled: true
  service:
    enabled: true
    port: 3000
    containerPort: 3000

executor:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  deployment:
    enabled: true

schedule:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  deployment:
    enabled: true

block:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  deployment:
    enabled: true

metricsCollector:
  enabled: true
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  deployment:
    enabled: true

# Both ON here, because this is the only values file the release workflow renders
# and it is the only place the whole chart is rendered at once - the unittest
# suites in tests/ each render a single template.
#
# Safe without the CloudNativePG operator installed: the workflow's `helm upgrade
# --dry-run` is client-side, so the Cluster CR is rendered but never sent to the
# API server for schema validation.
postgresql:
  bundled: true
queue:
  bundled: true
