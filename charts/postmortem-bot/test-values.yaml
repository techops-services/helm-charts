# Test values for postmortem-bot Helm chart
# Override values for testing/development environment

webhook:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/techops-services/postmortem-automation
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  env:
    - name: PAGERDUTY_API_KEY
      valueFrom:
        secretKeyRef:
          name: postmortem-secrets
          key: pagerduty-api-key
    - name: DISCORD_WEBHOOK_URL
      valueFrom:
        secretKeyRef:
          name: postmortem-secrets
          key: discord-webhook-url
    - name: GOOGLE_DRIVE_FOLDER_ID
      valueFrom:
        secretKeyRef:
          name: postmortem-secrets
          key: google-drive-folder-id

discordbot:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/techops-services/postmortem-automation
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8081
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  env:
    - name: DISCORD_BOT_TOKEN
      valueFrom:
        secretKeyRef:
          name: postmortem-secrets
          key: discord-bot-token

imagePullSecrets: []

commonLabels:
  environment: test
