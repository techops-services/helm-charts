webhook:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/techops-services/postmortem-automation
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  env: []
  # Example environment variables:
  # - name: PAGERDUTY_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: postmortem-secrets
  #       key: pagerduty-api-key

discordbot:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/techops-services/postmortem-automation
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  env: []
  # Example environment variables:
  # - name: DISCORD_BOT_TOKEN
  #   valueFrom:
  #     secretKeyRef:
  #       name: postmortem-secrets
  #       key: discord-bot-token

# Common image pull secrets
imagePullSecrets: []

# Common labels
commonLabels: {}
