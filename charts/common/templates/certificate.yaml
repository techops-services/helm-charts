{{- if and .Values.service.enabled .Values.service.tls.enabled }}
{{- $fullName := include "common.fullname" . -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullName }}
spec:
  secretName: {{ $fullName }}-tls
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    name: {{ include "common.render" (dict "value" .Values.service.tls.issuerName "ctx" $) }}
    kind: ClusterIssuer
  dnsNames:
  {{- range .Values.ingress.hosts }}
    - {{ include "common.render" (dict "value" . "ctx" $) | quote }}
  {{- end }}
{{- end }}
