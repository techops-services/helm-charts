{{- if .Values.serviceAccount.create -}}
{{- if .Values.serviceAccount.requireRoleArn }}
{{- $arn := get (.Values.serviceAccount.annotations | default dict) "eks.amazonaws.com/role-arn" | default "" }}
{{- if not (regexMatch "^arn:aws:iam::[0-9]{12}:role/.+$" $arn) }}
{{- fail (printf "serviceAccount eks.amazonaws.com/role-arn is missing or malformed: %q" $arn) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "common.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
