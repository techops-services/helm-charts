{{- $fullName := include "common.fullname" . -}}
{{- range $job := .Values.cronjob.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ $fullName }}-{{ $job.name }}"
spec:
  concurrencyPolicy: {{ $job.concurrencyPolicy }}
  failedJobsHistoryLimit: {{ $job.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ $job.backoffLimit | default "6" }}
      template:
        metadata:
          labels:
            app: {{ $fullName }}
            cron: {{ $job.name }}
        spec:
        {{- with $job.image.imagePullSecrets }}
          imagePullSecrets:
{{ toYaml . | indent 12 }}
        {{- end }}
        {{- if hasKey $job "serviceAccount" }}
        {{- if hasKey $job.serviceAccount "name" }}
          serviceAccountName: {{ $job.serviceAccount.name }}
        {{- else }}
          serviceAccountName: {{ $job.name }}
        {{- end }}
        {{- end }}
        {{- if hasKey $job "securityContext" }}
          {{- if $job.securityContext.runAsUser }}
          securityContext:
            runAsUser: {{ $job.securityContext.runAsUser }}
            {{- if $job.securityContext.runAsGroup }}
            runAsGroup: {{ $job.securityContext.runAsGroup }}
            {{- end }}
            {{- if $job.securityContext.fsGroup }}
            fsGroup: {{ $job.securityContext.fsGroup }}
            {{- end }}
          {{- end }}
        {{- end }}
          containers:
          - image: "{{ include "common.render" (dict "value" $job.image.repository "ctx" $) }}:{{ include "common.render" (dict "value" $job.image.tag "ctx" $) }}"
            imagePullPolicy: {{ include "common.render" (dict "value" $job.image.imagePullPolicy "ctx" $) }}
            name: {{ $job.name }}
            {{- if $job.env }}
            env:
              {{- range $k, $v := $job.env }}
              - name: {{ $k | quote }}
              {{- if eq $v.type "kv" }}
                value: {{ $v.value | quote }}
              {{- else if eq $v.type "template" }}
                value: {{ include "common.render" (dict "value" $v.value "ctx" $) | quote }}
              {{- else if eq $v.type "secret" }}
                valueFrom:
                  secretKeyRef:
                    name: {{ include "common.render" (dict "value" $v.name "ctx" $) | quote }}
                    key: {{ include "common.render" (dict "value" $v.key "ctx" $) | quote }}
              {{- else if eq $v.type "parameterStore" }}
                valueFrom:
                  secretKeyRef:
                    name: "{{ $fullName }}-{{ $v.name }}"
                    key: "{{ $fullName }}-{{ $v.name }}"
              {{- else if eq $v.type "configmapRef" }}
                valueFrom:
                  configMapKeyRef:
                    name: {{ include "common.render" (dict "value" $v.name "ctx" $) | quote }}
                    key: {{ include "common.render" (dict "value" $v.key "ctx" $) | quote }}
              {{- end }}
              {{- end }}
            {{- end }}
            {{- if $job.command }}
            command: {{ $job.command }}
            {{- end }}
            {{- with $job.args }}
            args:
{{ toYaml . | indent 12 }}
              {{- end }}
            {{- with $job.resources }}
            resources:
{{ toYaml . | indent 14 }}
            {{- end }}
            {{- with $job.volumeMounts }}
            volumeMounts:
{{ toYaml . | indent 12 }}
            {{- end }}
          {{- with $job.nodeSelector }}
          nodeSelector:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $job.affinity }}
          affinity:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $job.tolerations }}
          tolerations:
{{ toYaml . | indent 12 }}
          {{- end }}
          restartPolicy: {{ $job.restartPolicy }}
          {{- with $job.volumes }}
          volumes:
{{ toYaml . | indent 12 }}
          {{- end }}
  schedule: {{ $job.schedule | quote }}
  successfulJobsHistoryLimit: {{ $job.successfulJobsHistoryLimit }}
{{- end }}
