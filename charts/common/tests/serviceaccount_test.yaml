suite: serviceAccount IRSA role-arn guard
templates:
  - templates/serviceAccount.yaml
tests:
  - it: fails when role-arn is empty and requireRoleArn is true
    set:
      serviceAccount:
        create: true
        requireRoleArn: true
        annotations:
          eks.amazonaws.com/role-arn: ""
    asserts:
      - failedTemplate:
          errorPattern: "role-arn is missing or malformed"

  - it: fails when role-arn annotation is absent and requireRoleArn is true
    set:
      serviceAccount:
        create: true
        requireRoleArn: true
        annotations: {}
    asserts:
      - failedTemplate:
          errorPattern: "role-arn is missing or malformed"

  - it: fails when role-arn is malformed and requireRoleArn is true
    set:
      serviceAccount:
        create: true
        requireRoleArn: true
        annotations:
          eks.amazonaws.com/role-arn: "not-an-arn"
    asserts:
      - failedTemplate:
          errorPattern: "role-arn is missing or malformed"

  - it: renders the ServiceAccount when role-arn is well-formed
    set:
      serviceAccount:
        create: true
        requireRoleArn: true
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/keeperhub-prod"
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789012:role/keeperhub-prod"

  - it: does not enforce when requireRoleArn is false even with an empty role-arn
    set:
      serviceAccount:
        create: true
        requireRoleArn: false
        annotations:
          eks.amazonaws.com/role-arn: ""
    asserts:
      - isKind:
          of: ServiceAccount

  - it: does not enforce by default (requireRoleArn unset)
    set:
      serviceAccount:
        create: true
        annotations: {}
    asserts:
      - isKind:
          of: ServiceAccount
