suite: ExternalSecret refresh interval
templates:
  - templates/externalSecret.yaml
values:
  - ../test-values.yaml
tests:
  # Every ExternalSecret polls Parameter Store on its own timer. At 1m across a
  # few hundred secrets that was 90% of the account's CloudTrail volume and
  # ~9.2M KMS Decrypt calls a month (KEEP-1380), so the default is 1h.
  - it: defaults the refresh interval to 1h
    set:
      externalSecrets:
        clusterSecretStoreName: techops-prod
      env:
        DB_PASSWORD:
          type: parameterStore
          name: db-password
          parameter_name: /eks/techops-prod/keeperhub/db-password
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: honours an explicit refresh interval
    set:
      externalSecrets:
        clusterSecretStoreName: techops-prod
        refreshInterval: 30s
      env:
        DB_PASSWORD:
          type: parameterStore
          name: db-password
          parameter_name: /eks/techops-prod/keeperhub/db-password
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 30s

  - it: still points at the configured ClusterSecretStore and remote key
    set:
      externalSecrets:
        clusterSecretStoreName: techops-staging
      env:
        DB_PASSWORD:
          type: parameterStore
          name: db-password
          parameter_name: /eks/techops-staging/keeperhub/db-password
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: techops-staging
      - equal:
          path: spec.data[0].remoteRef.key
          value: /eks/techops-staging/keeperhub/db-password

  - it: renders nothing for an env value that is not a parameterStore entry
    set:
      externalSecrets:
        clusterSecretStoreName: techops-prod
      env:
        LOG_LEVEL:
          type: kv
          value: info
    asserts:
      - hasDocuments:
          count: 0
